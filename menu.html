<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu Board</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body class="board">
  <div class="hero"><h1>Menu</h1><div class="small" style="color:#ffd">Fresh, fast, and tasty. <span class="kbd">Ctrl</span>+<span class="kbd">Shift</span>+<span class="kbd">E</span> to add items (admin).</div></div>
  <div class="cats" id="cats"></div>
  <div class="grid" id="menuGrid"></div>

  <div class="modal" id="addModal">
    <div class="box">
      <h2 style="margin-top:0">Menu Adder</h2>
      <p class="small">Add items to the menu (saved on this device/browser).</p>
      <label>Name</label><input id="mName" placeholder="e.g. Cheeseburger" />
      <label>Category</label>
      <select id="mCat"><option>Food</option><option>Drinks</option><option>Desserts</option><option>Deals</option></select>
      <label>Price</label><input id="mPrice" type="number" step="0.01" min="0" placeholder="4.99" />
      <label>Picture URL or data</label><input id="mImg" placeholder="https://... or leave blank" />
      <label>Or upload picture</label><input id="mFile" type="file" accept="image/*" />
      <div class="row" style="margin-top:14px">
        <button class="btn" id="saveItem">Add Item</button>
        <button class="btn secondary" id="closeAdd">Close</button>
      </div>
    </div>
  </div>

  <script src="js/app.js"></script>
  <script>
    let activeCat='All';
    function render(){
      const d=DT.load();
      const cats=['All',...Array.from(new Set(d.menu.map(m=>m.category||'Other')))];
      const catsEl=document.getElementById('cats');
      catsEl.innerHTML=cats.map(c=>`<div class="cat ${c===activeCat?'active':''}" data-cat="${c}">${c}</div>`).join('');
      catsEl.querySelectorAll('.cat').forEach(el=>el.onclick=()=>{activeCat=el.dataset.cat; render();});
      const items=d.menu.filter(m=>activeCat==='All'||(m.category||'Other')===activeCat);
      document.getElementById('menuGrid').innerHTML=items.map(m=>`
        <div class="tile"><img src="${m.img||'https://via.placeholder.com/400x240?text=Item'}" alt=""><div class="info"><div class="name">${m.name}</div><div class="price">${DT.fmt(m.price)}</div></div></div>
      `).join('') || '<div style="padding:20px;color:#bbb">No items yet. Press Ctrl+Shift+E to add.</div>';
    }
    const modal=document.getElementById('addModal');
    window.addEventListener('keydown',e=>{if(e.ctrlKey && e.shiftKey && (e.key==='e'||e.key==='E')){e.preventDefault(); modal.classList.add('open'); document.getElementById('mName').focus();}});
    document.getElementById('closeAdd').onclick=()=>modal.classList.remove('open');
    modal.addEventListener('click',e=>{if(e.target===modal) modal.classList.remove('open')});
    async function fileToDataUrl(file){return new Promise((res,rej)=>{const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=rej; r.readAsDataURL(file);});}
    document.getElementById('saveItem').onclick=async()=>{
      const name=document.getElementById('mName').value.trim();
      const price=parseFloat(document.getElementById('mPrice').value||'0');
      const cat=document.getElementById('mCat').value;
      let img=document.getElementById('mImg').value.trim();
      const file=document.getElementById('mFile').files[0];
      if(!name){alert('Enter a name'); return;}
      if(file){try{img=await fileToDataUrl(file);}catch(e){}}
      DT.addMenuItem({id:DT.uid(),name,category:cat,price,isNaN(price)?0:price,img:img||'https://via.placeholder.com/400x240?text=Item'});
      document.getElementById('mName').value=''; document.getElementById('mPrice').value=''; document.getElementById('mImg').value=''; document.getElementById('mFile').value='';
      modal.classList.remove('open'); render();
    };
    window.addEventListener('storage',render); window.addEventListener('dt-update',render);
    render();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
