<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DSMDonalds" />
  <meta name="theme-color" content="#0f1115" />
  <title>Register</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="topbar"><div class="title">DSM Register</div><div style="display:flex;gap:10px;align-items:center"><button class="btn secondary" id="mobileAppBtn" style="padding:8px 12px">Rewards Code</button><a href="admin.html">Admin</a></div></div>
  <div class="pos">
    <div class="pos-left">
      <div class="pos-head"><h2>Menu</h2><div class="small">Tap items to add</div></div>
      <div id="menuGrid" class="menu-grid"></div>
      <div class="panel" style="margin-top:14px">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:10px"><h3 style="margin:0">Rewards & Offers</h3><span class="badge" id="linkedBadge">No account</span></div>
        <div id="rewardInfo" class="small" style="margin-top:6px">Link a customer's 4-digit rewards code.</div>
        <div class="row" style="margin-top:10px"><select id="offerSelect"></select><button class="btn secondary" id="redeemBtn">Redeem</button></div>
      </div>
    </div>
    <div class="pos-right">
      <div class="pos-head"><h2>Current Sale</h2><button class="btn secondary" id="clearCart" style="padding:8px 12px">Clear</button></div>
      <div class="pos-cart" id="cart"></div>
      <div class="pos-totals">
        <div class="small">Total</div>
        <div class="pos-total"><span>Amount due</span><span id="total">$0.00</span></div>
        <button class="charge-btn" id="tapPay">Tap to Pay</button>
        <button class="btn secondary block" id="cashPay" style="margin-top:10px">Cash / External Card</button>
        <div id="payArea" style="margin-top:12px"></div>
      </div>
    </div>
  </div>

  <div class="modal" id="codeModal"><div class="box">
    <h3 style="margin-top:0">Link Rewards (4-code)</h3>
    <p class="small">Enter the customer's 4-digit rewards code from the DSM app.</p>
    <input id="codeInput" maxlength="4" inputmode="numeric" placeholder="1234" />
    <div class="row" style="margin-top:12px"><button class="btn" id="linkCode">Link</button><button class="btn secondary" id="closeCode">Cancel</button></div>
  </div></div>

  <script src="js/app.js"></script>
  <script>
    let cart=[]; let linkedUserId=null; let currentPayment=null; let payPoll=null;
    function $(id){return document.getElementById(id)}
    function renderMenu(){
      const d=DT.load();
      $('menuGrid').innerHTML=d.menu.map(m=>`
        <div class="item" data-id="${m.id}"><img src="${m.img||''}" alt=""><div class="info"><div class="name">${m.name}</div><div class="price">${DT.fmt(m.price)}</div></div></div>
      `).join('') || '<div class="small">No menu items. Open Menu Board and click + Add Item.</div>';
      document.querySelectorAll('.item').forEach(el=>el.onclick=()=>{
        const item=d.menu.find(x=>x.id===el.dataset.id); if(!item) return;
        cart.push({id:item.id,name:item.name,price:Number(item.price)}); renderCart();
      });
    }
    function total(){return cart.reduce((s,i)=>s+Number(i.price||0),0)}
    function renderCart(){
      $('cart').innerHTML=cart.map((c,i)=>`<div class="pos-line"><span class="nm">${c.name}</span><span><span class="pr">${DT.fmt(c.price)}</span> <button data-i="${i}" class="rm" style="margin-left:8px;background:#2a2f3d;color:#fff;border:0;border-radius:8px;padding:2px 8px;cursor:pointer">×</button></span></div>`).join('') || '<div class="small" style="padding:20px 0">No items yet</div>';
      document.querySelectorAll('.rm').forEach(b=>b.onclick=()=>{cart.splice(Number(b.dataset.i),1); renderCart();});
      $('total').textContent=DT.fmt(total());
      $('tapPay').disabled = total()<=0;
      renderLinked();
    }
    function renderLinked(){
      const info=$('rewardInfo'); const sel=$('offerSelect'); const badge=$('linkedBadge');
      const d=DT.load();
      if(!linkedUserId){badge.textContent='No account'; info.innerHTML='Link a customer\'s 4-digit rewards code.'; sel.innerHTML='<option value="">Link account to redeem</option>'; return;}
      const u=d.users.find(x=>x.id===linkedUserId);
      if(!u){linkedUserId=null; renderLinked(); return;}
      badge.textContent=u.name; info.innerHTML=`<b>${u.name}</b> · Code ${u.code} · Points <b>${u.points||0}</b> · Balance <b>${DT.fmt(u.balance||0)}</b>`;
      sel.innerHTML='<option value="">Select offer</option>'+d.offers.map(o=>`<option value="${o.id}">${o.title} (${o.cost} pts)${(u.points||0)<o.cost?' - need more':''}</option>`).join('');
    }
    function stopPoll(){ if(payPoll) clearInterval(payPoll); payPoll=null; }
    function completeOrder(paymentMethod){
      const d=DT.load(); const t=total(); if(t<=0){return false;}
      if(linkedUserId){ const u=d.users.find(x=>x.id===linkedUserId); if(u){ u.points = (u.points||0) + Math.floor(t * (d.rewards.pointsPerDollar||10)); } }
      DT.save(d);
      cart=[]; currentPayment=null; DT.clearPendingPayment(); stopPoll();
      $('payArea').innerHTML=`<div class="panel tap-screen"><div class="pay-success">Payment complete</div><div class="small">${paymentMethod}${linkedUserId?' · points awarded':''}</div></div>`;
      setTimeout(()=>{ if($('payArea').querySelector('.pay-success')) $('payArea').innerHTML=''; }, 3500);
      renderCart(); return true;
    }
    $('clearCart').onclick=()=>{cart=[]; stopPoll(); DT.clearPendingPayment(); currentPayment=null; $('payArea').innerHTML=''; renderCart();};
    const cm=$('codeModal');
    $('mobileAppBtn').onclick=()=>{cm.classList.add('open'); $('codeInput').focus();};
    $('closeCode').onclick=()=>cm.classList.remove('open');
    $('linkCode').onclick=()=>{
      const code=$('codeInput').value.trim(); const u=DT.getUserByCode(code);
      if(!u){alert('No account found for that 4-code.'); return;}
      linkedUserId=u.id; cm.classList.remove('open'); $('codeInput').value=''; renderLinked();
    };
    $('cashPay').onclick=()=>{ if(total()<=0){alert('Cart is empty');return;} completeOrder('Cash / external card'); };

    $('tapPay').onclick=()=>{
      const t=total(); if(t<=0){return;}
      currentPayment={id:DT.uid(), amount:t, created:Date.now(), status:'pending', forUserId:linkedUserId||null};
      DT.setPendingPayment(currentPayment);
      const payload=JSON.stringify({t:'pay',id:currentPayment.id,amount:t});
      const qr=DT.makeQRUrl(payload,220);
      $('payArea').innerHTML=`<div class="panel tap-screen">
        <div class="small">Tap to Pay</div>
        <div class="tap-amount">${DT.fmt(t)}</div>
        <div class="tap-visual"><div class="tap-icon">))</div></div>
        <div class="tap-status" id="tapStatus">Ready for tap</div>
        <div class="tap-sub">Customer: open DSM app → Scan & pay, then scan this code with their phone to pay from balance.</div>
        <div class="qr-box" style="margin:14px auto 8px;max-width:240px"><img src="${qr}" alt="QR"></div>
        <div class="row" style="margin-top:8px;justify-content:center"><button class="btn secondary" id="cancelPay">Cancel</button></div>
      </div>`;
      $('cancelPay').onclick=()=>{stopPoll(); DT.clearPendingPayment(); currentPayment=null; $('payArea').innerHTML='';};
      stopPoll();
      payPoll=setInterval(async()=>{
        if(DT.pullSync) await DT.pullSync(false);
        const d=DT.load(); const p=d.pendingPayment;
        if(p && currentPayment && p.id===currentPayment.id && p.status==='paid'){
          stopPoll();
          const st=$('tapStatus'); if(st){st.textContent='Approved'; st.className='tap-status pay-success';}
          setTimeout(()=>completeOrder('Tap to Pay'), 700);
        }
      }, 1500);
    };

    $('redeemBtn').onclick=()=>{
      if(!linkedUserId){alert('Link a rewards account first.'); return;}
      const offerId=$('offerSelect').value; if(!offerId){alert('Select an offer'); return;}
      const d=DT.load(); const u=d.users.find(x=>x.id===linkedUserId); const o=d.offers.find(x=>x.id===offerId);
      if(!u||!o) return;
      if((u.points||0) < Number(o.cost||0)){alert('Not enough points'); return;}
      u.points -= Number(o.cost||0); u.offers=u.offers||[]; u.offers.push({id:DT.uid(),title:o.title,redeemedAt:Date.now()});
      DT.save(d); alert('Redeemed: '+o.title); renderLinked();
    };
    window.addEventListener('storage',()=>{renderMenu(); renderLinked();});
    window.addEventListener('dt-update',()=>{renderMenu(); renderLinked();});
    renderMenu(); renderCart();
  </script>
  <script>if('serviceWorker' in navigator){navigator.serviceWorker.register('./sw.js').catch(()=>{});}</script>
</body>
</html>
